<!DOCTYPE html>
<html lang="en">
<head>
  <script>if (location.protocol === "http:" && /legacybiblechurch\.com$/.test(location.hostname)) location.replace("https:" + location.href.slice(5));</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service begins shortly — Legacy Bible Church</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* The pre-service screen for the livestream. Load it as a full-screen web
       widget in PRISM. It covers the camera until the service time, counts down
       the last hour, then fades away on its own and the camera shows through.
       See STREAM.md for URL options. */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f1efe9;
      cursor: none;
      user-select: none; -webkit-user-select: none;
    }

    #card {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 4vh 6vw;
      opacity: 0;
      transition: opacity 1.6s ease;
    }
    #card.on { opacity: 1; }

    /* the logo is drawn on left to right, like the website's entrance */
    #logo {
      height: 32vh; width: auto; max-width: 78vw;
      opacity: 0;
      -webkit-mask-image: linear-gradient(to right, #000 0 44%, rgba(0,0,0,0) 49%);
              mask-image: linear-gradient(to right, #000 0 44%, rgba(0,0,0,0) 49%);
      -webkit-mask-repeat: no-repeat;          mask-repeat: no-repeat;
      -webkit-mask-size: 235% 100%;            mask-size: 235% 100%;
      -webkit-mask-position: 100% 0;           mask-position: 100% 0;
    }
    #card.on #logo { animation: draw 2.6s cubic-bezier(0.62, 0.03, 0.24, 1) 0.2s forwards; }
    @keyframes draw {
      0%   { opacity: 0; -webkit-mask-position: 100% 0; mask-position: 100% 0; }
      6%   { opacity: 1; }
      100% { opacity: 1; -webkit-mask-position: 0% 0;   mask-position: 0% 0; }
    }

    #l1 {
      margin-top: 5vh;
      font-size: clamp(16px, 4.6vmin, 64px);
      font-weight: 300; letter-spacing: 0.02em;
    }
    #l2 {
      margin-top: 1.8vh;
      font-size: clamp(11px, 2.1vmin, 28px);
      font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase;
      color: #C9A84C;
    }
    #count {
      margin-top: 4.5vh;
      min-height: 1.3em;
      font-size: clamp(14px, 3vmin, 40px);
      font-weight: 300; letter-spacing: 0.08em;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
    }

    /* ?debug=1  small status box for the dry run */
    #hud {
      position: fixed; top: 8px; left: 8px; z-index: 9;
      font: 12px/1.5 ui-monospace, Menlo, monospace;
      background: rgba(0,0,0,0.78); color: #9fe39f;
      padding: 6px 10px; border-radius: 6px; display: none; white-space: pre;
    }
  </style>
</head>
<body>

  <div id="card">
    <img id="logo" src="images/logo-dark.png" alt="Legacy Bible Church">
    <div id="l1">Service begins shortly</div>
    <div id="l2"></div>
    <div id="count"></div>
  </div>
  <div id="hud"></div>

  <script>
  (function () {
    var qs    = new URLSearchParams(location.search);
    var TZ    = qs.get('tz') || 'America/Los_Angeles';
    var parts = (qs.get('at') || '10:30').split(':');
    var AT    = (+parts[0] || 0) * 3600 + (+parts[1] || 0) * 60;            // service start, seconds into the day
    var IN    = qs.has('in') ? parseFloat(qs.get('in')) : null;             // rehearsal: pretend it starts in N minutes
    var HOLD  = qs.has('hold') ? parseFloat(qs.get('hold')) : 2;            // minutes to stay up after the start time
    var PIN   = qs.has('pin');                                              // never fade away
    var MUSIC = qs.get('music') || '';                                      // optional audio file address
    var VOL   = qs.has('vol') ? parseFloat(qs.get('vol')) : 0.5;
    var DEBUG = qs.has('debug');

    var card = document.getElementById('card'), l1 = document.getElementById('l1'),
        l2 = document.getElementById('l2'), count = document.getElementById('count');
    var t0 = Date.now(), done = false, state = '-', rem = null, musicState = MUSIC ? 'waiting' : 'none', audio = null;

    function ptNow() {
      var o = {};
      new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour12: false, weekday: 'short', hour: 'numeric', minute: 'numeric', second: 'numeric' })
        .formatToParts(new Date()).forEach(function (x) { o[x.type] = x.value; });
      return { dow: o.weekday, secs: (+o.hour % 24) * 3600 + (+o.minute) * 60 + (+o.second) };
    }
    // seconds until the service starts (negative once it has), or null on a day with no service
    function remaining() {
      if (IN !== null) return IN * 60 - (Date.now() - t0) / 1000;
      var p = ptNow();
      return p.dow === 'Sun' ? AT - p.secs : null;
    }
    function clock() {
      var h = Math.floor(AT / 3600), m = Math.floor((AT % 3600) / 60), ap = h >= 12 ? 'PM' : 'AM';
      return (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
    }
    function mmss(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

    // ── music (optional): plays while the card is up, fades out with it
    function startMusic() {
      if (!MUSIC || audio) return;
      audio = new Audio(MUSIC); audio.loop = true; audio.volume = Math.max(0, Math.min(1, VOL));
      audio.play().then(function () { musicState = 'playing'; }).catch(function () {
        musicState = 'blocked (needs a tap)';
        var retry = function () { audio.play().then(function () { musicState = 'playing'; }).catch(function () {}); };
        ['click', 'touchstart', 'keydown'].forEach(function (ev) { document.addEventListener(ev, retry, { once: true }); });
      });
    }
    function stopMusic() {
      if (!audio) return;
      var a = audio, v = a.volume, step = v / 30;
      var iv = setInterval(function () { v -= step; if (v <= 0.01) { clearInterval(iv); a.pause(); musicState = 'stopped'; } else a.volume = v; }, 100);
    }

    function show() { if (!card.classList.contains('on')) { card.classList.add('on'); startMusic(); } }
    function hide() { done = true; card.classList.remove('on'); stopMusic(); }

    function tick() {
      if (done) return;
      rem = remaining();
      if (rem === null) {                         // not a service day: a plain card
        state = 'no service today'; l2.textContent = 'Sunday · ' + clock(); count.textContent = ''; show();
      } else if (rem > 0 || PIN) {
        state = 'before'; l2.textContent = 'Sunday · ' + clock();
        l1.textContent = rem > 10 || rem === null ? 'Service begins shortly' : 'We are about to begin';
        count.textContent = rem > 0 && rem <= 3600 ? 'Starting in ' + mmss(rem) : '';
        show();
      } else if (rem > -HOLD * 60) {
        state = 'starting'; l1.textContent = 'We are about to begin'; count.textContent = ''; show();
      } else {
        state = 'finished'; hide();
      }
    }

    tick();
    setInterval(tick, 500);

    if (DEBUG) {
      var hud = document.getElementById('hud');
      hud.style.display = 'block';
      setInterval(function () {
        hud.textContent =
          'state  ' + state + '\n' +
          'start  ' + (IN !== null ? 'rehearsal, in ' + IN + ' min' : 'Sundays ' + clock() + ' (' + TZ + ')') + '\n' +
          'left   ' + (rem === null ? '-' : Math.round(rem) + ' s') + '\n' +
          'music  ' + musicState + (PIN ? '\npinned (will not fade)' : '');
      }, 500);
    }
  })();
  </script>
</body>
</html>
