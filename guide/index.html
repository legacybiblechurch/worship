<!DOCTYPE html>
<html lang="en">
<head>
  <script>if (location.protocol === "http:" && /legacybiblechurch\.com$/.test(location.hostname)) location.replace("https:" + location.href.slice(5));</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worship Guide · Legacy Bible Church</title>
  <!-- The Worship guide QR code on the TV points here. This page shows the worship guide itself: the Word document
       Pastor Todd writes, exactly as he wrote it, in dark mode. Nothing is retyped.
         guide.docx     the document. The Studio puts it here when the guide is imported; a connected computer can
                        also replace it from the link at the bottom of this page.
       No document posted yet: the page goes to the Sunday Starts Saturday page instead. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: #9a9a9e; font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; -webkit-text-size-adjust: 100%; }
    #doc { opacity: 0; transition: opacity .5s ease; }
    #doc.in { opacity: 1; }
    /* dark mode and nothing else: the page and everything on it is turned light for dark, hues kept */
    #doc .docx-wrapper { background: #000; padding: 14px 0 6px; display: block; }
    #doc section.docx { box-shadow: none; margin: 0 auto 14px; background: #fff; filter: invert(1) hue-rotate(180deg); }
    /* on a phone the document flows to the width of the screen so it can be read without pinching */
    #doc.flow section.docx { width: auto !important; min-height: 0 !important; padding: 18px 18px 26px !important; column-count: auto !important; }
    /* a blank in the sermon outline: tap it and write the word in. It is kept on that phone only. */
    #doc .fill { display: inline-block; min-width: 7.5em; padding: 0 5px; border-bottom: 1px solid currentColor; text-align: center; text-transform: uppercase; outline: none; cursor: text; line-height: 1.15; -webkit-user-select: text; user-select: text; }
    #doc .fill:empty::before { content: 'tap to write'; text-transform: none; font-size: 0.72em; opacity: 0.38; }
    #doc .fill:focus { border-bottom-width: 2px; }
    #doc .fill:focus:empty::before { content: ''; }
    #msg { padding: 60px 22px; text-align: center; }
    #msg a { color: #c9a84c; }
    #admin { padding: 18px 18px 40px; text-align: center; font-size: 13px; color: #62626a; }
    #admin button { background: none; border: 1px solid #2a2a2e; color: #9a9a9e; font: inherit; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
    #admin button:hover { color: #ececed; border-color: #62626a; }
    #admin .note { display: block; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <div id="doc"></div>
  <div id="msg" hidden></div>
  <div id="admin" hidden>
    <input type="file" id="pick" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    <button type="button" id="replace">Replace the document</button>
    <span class="note" id="note"></span>
  </div>

  <!-- this Sunday's songs, as set in the Studio: they are written in where the guide only says "Song" -->
  <script src="../js/songs-data.js"></script>
  <script src="../js/worship-service.js"></script>
  <script src="../js/sheet.js?v=40"></script>
  <script src="../js/vendor/jszip.min.js"></script>
  <script src="../js/vendor/docx-preview.min.js"></script>
  <script>
  (function () {
    'use strict';
    var REPO = 'legacybiblechurch/worship', PATH = 'guide/guide.docx';
    var FALLBACK = 'https://legacybiblechurch.github.io/legacy-bible-church/prepare.html';
    var doc = document.getElementById('doc'), msg = document.getElementById('msg'), admin = document.getElementById('admin'), note = document.getElementById('note');
    function token() { try { return localStorage.getItem('lbc-gh-token') || ''; } catch (e) { return ''; } }
    var phone = Math.min(window.innerWidth, screen.width || 9999) < 700;

    function show(blob) {
      doc.className = phone ? 'flow' : ''; doc.innerHTML = '';
      var logoDone = false;
      return docx.renderAsync(blob, doc, null, { inWrapper: true, ignoreWidth: phone, ignoreHeight: phone, breakPages: !phone, useBase64URL: true }).then(function () {
        // A picture placed by its distance from the corner of the page (the logo across the top) comes out of the
        // converter hanging off the middle of its line, half off the page. Put it where Word has it.
        doc.querySelectorAll('section.docx div').forEach(function (d) {
          var im = d.querySelector('img');
          if (!im || d.style.width !== '0px' || d.style.height !== '0px' || d.style.position !== 'relative') return;
          var sec = d.closest('section.docx');
          if (d.closest('header') && !logoDone) { logoDone = true; im.setAttribute('data-letterhead', '1'); }   // the letterhead across the top
          if (phone) {
            d.style.cssText = 'display:block;position:static;width:100%;text-align:center;margin:0 0 10px;';
            im.style.cssText = 'position:static;width:100%;max-width:' + (im.style.width || '100%') + ';height:auto;';
          } else if (sec) {
            // its distance is measured from the left edge of the page, not from where its line happens to start
            var want = sec.getBoundingClientRect().left + (parseFloat(d.style.left) || 0) * 96 / 72;
            var off = want - im.getBoundingClientRect().left;
            if (Math.abs(off) > 1) d.style.left = ((parseFloat(d.style.left) || 0) * 96 / 72 + off) + 'px';
          }
        });
        // On a phone the wide page margins are gone, so lines that reach out into those margins would be cut off
        // at the edge of the screen. Bring them back inside.
        if (phone) doc.querySelectorAll('section.docx p, section.docx li, section.docx table').forEach(function (e) {
          var c = getComputedStyle(e);
          var ml = parseFloat(c.marginLeft) || 0, ti = parseFloat(c.textIndent) || 0;
          if (ml < 0) { ml = 0; e.style.marginLeft = '0'; }
          if (ti < 0 && ml < -ti) e.style.marginLeft = (-ti) + 'px';          // a hanging number needs room to hang
          if (parseFloat(c.marginRight) < 0) e.style.marginRight = '0';
        });
        songNames(); blanks();
        // Pictures keep their own colours. Dark mode flips light and dark, which would turn them into negatives.
        // So each picture is put back to its true colours, and its white paper is made see-through so it sits on
        // the dark page instead of in a white box. The letterhead is the one exception: see below.
        doc.querySelectorAll('section.docx img').forEach(function (im) {
          var letterhead = !!im.getAttribute('data-letterhead');
          function fix() {
            try {
              var w = im.naturalWidth, h = im.naturalHeight; if (!w || !h) return;
              var k = Math.min(1, 1600 / w), c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
              var x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
              var d = x.getImageData(0, 0, c.width, c.height), p = d.data;
              for (var i = 0; i < p.length; i += 4) {
                var a = Math.min(1, (255 - Math.min(p[i], p[i + 1], p[i + 2])) / 200) * (p[i + 3] / 255);   // how much ink, how little paper
                if (a <= 0) { p[i + 3] = 0; continue; }
                for (var j = 0; j < 3; j++) p[i + j] = Math.max(0, Math.min(255, (p[i + j] - (1 - a) * 255) / a));   // the ink's own colour, the paper taken out
                // the letterhead takes the church's normal colours: its burgundy ink turns white, its gold is left as it is
                if (letterhead && !(p[i + 1] > p[i] * 0.5 && p[i] > p[i + 2] + 30)) { p[i] = 246; p[i + 1] = 246; p[i + 2] = 246; }
                p[i + 3] = Math.round(a * 255);
              }
              x.putImageData(d, 0, 0);
              im.onload = null; im.src = c.toDataURL('image/png');
              im.style.filter = 'invert(1) hue-rotate(180deg)';      // cancels the page's dark-mode flip for this picture only
            } catch (e) {}
          }
          if (im.complete && im.naturalWidth) fix(); else im.onload = fix;
        });
        // a printed page is wider than some windows: bring it down to fit, never up
        if (!phone) { var s = doc.querySelector('section.docx'); if (s) { var k = Math.min(1, (window.innerWidth - 24) / s.getBoundingClientRect().width); doc.querySelector('.docx-wrapper').style.zoom = k; } }
        doc.classList.add('in'); msg.hidden = true;
      });
    }
    // ── Where the guide only says "Song", write in the songs chosen in the Studio, in order. Only when the guide and
    // the Studio are plainly about the same Sunday (the same Scripture reading), so last week's songs never land
    // on this week's guide. Nobody has to type them into the document.
    function flat(t) { return String(t || '').toLowerCase().replace(/[\u2010-\u2015]/g, '-').replace(/\s+/g, ''); }
    function songNames() {
      try {
        if (!window.LBCSheet) return;
        var svc = LBCSheet.service(), reading = svc.filter(function (it) { return it.type === 'scripture' && it.ref; })[0];
        if (!reading || flat(doc.textContent).indexOf(flat(reading.ref)) < 0) return;
        var titles = svc.filter(function (it) { return it.type === 'song' && !it.after; }).map(function (it) { return LBCSheet.titleOf(it.slug); });
        var spots = [].slice.call(doc.querySelectorAll('section.docx p')).filter(function (p) { return /^song$/i.test(p.textContent.trim()); });
        spots.forEach(function (p, i) {
          if (!titles[i]) return;
          var w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT), n, first = true;
          while ((n = w.nextNode())) { if (!n.nodeValue.trim()) continue; n.nodeValue = first ? titles[i] : ''; first = false; }
        });
      } catch (e) {}
    }
    // ── A line of underscores is a blank to fill in. Make each one a place to write. What is written stays on that
    // phone (nothing is sent anywhere) and is forgotten when a new guide is posted.
    function blanks() {
      try {
        var key = 'lbc-guide-fill-' + (function (t) { var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); })(flat(doc.textContent));
        var kept = {}; try { kept = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) {}
        var w = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT), n, found = [];
        while ((n = w.nextNode())) if (/_{3,}/.test(n.nodeValue) && n.parentNode.closest('section.docx')) found.push(n);
        var count = 0;
        found.forEach(function (node) {
          var parts = node.nodeValue.split(/(_{3,})/), frag = document.createDocumentFragment();
          parts.forEach(function (part) {
            if (!/^_{3,}$/.test(part)) { if (part) frag.appendChild(document.createTextNode(part)); return; }
            var id = 'b' + (count++), f = document.createElement('span');
            f.className = 'fill'; f.setAttribute('contenteditable', 'plaintext-only'); if (f.contentEditable !== 'plaintext-only') f.setAttribute('contenteditable', 'true');
            f.setAttribute('role', 'textbox'); f.setAttribute('aria-label', 'Blank to fill in'); f.spellcheck = false;
            f.textContent = kept[id] || '';
            f.addEventListener('input', function () { kept[id] = f.textContent.replace(/\s+/g, ' ').trim(); try { localStorage.setItem(key, JSON.stringify(kept)); } catch (e) {} });
            f.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); f.blur(); } });
            f.addEventListener('blur', function () { if (!f.textContent.trim()) f.textContent = ''; });
            frag.appendChild(f);
          });
          var host = node.parentNode;
          if (host.style) host.style.textDecoration = 'none';        // the run was underlined to draw the line; the blank draws its own
          host.replaceChild(frag, node);
        });
      } catch (e) {}
    }
    function load() {
      return fetch('guide.docx?cb=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('none'); return r.blob(); }).then(show);
    }
    load().catch(function () {
      // nothing posted (or it would not open): a connected computer is asked for the document, everyone else gets Sunday's order
      if (token()) { msg.hidden = false; msg.textContent = 'No worship guide is posted yet. Add it below.'; }
      else location.replace(FALLBACK);
    });

    // ── a connected computer can put this Sunday's document here
    if (token()) {
      admin.hidden = false;
      var pick = document.getElementById('pick');
      document.getElementById('replace').onclick = function () { pick.click(); };
      pick.onchange = function () {
        var f = pick.files && pick.files[0]; pick.value = ''; if (!f) return;
        if (!/\.docx$/i.test(f.name)) { note.textContent = 'Choose the Word document (.docx).'; return; }
        note.textContent = 'Saving ' + f.name + '…';
        var hdr = { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token(), 'X-GitHub-Api-Version': '2022-11-28' };
        var api = 'https://api.github.com/repos/' + REPO + '/contents/' + PATH;
        var b64 = new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(String(fr.result).split(',')[1]); }; fr.onerror = rej; fr.readAsDataURL(f); });
        Promise.all([b64, fetch(api + '?ref=main&cb=' + Date.now(), { headers: hdr }).then(function (r) { return r.ok ? r.json() : null; })]).then(function (a) {
          return fetch(api, { method: 'PUT', headers: hdr, body: JSON.stringify({ message: 'worship guide: ' + f.name, content: a[0], sha: a[1] ? a[1].sha : undefined, branch: 'main' }) });
        }).then(function (r) {
          if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'This computer is not allowed to save. Connect it in the Studio.' : 'It did not save (' + r.status + '). Try again.');
          note.textContent = 'Saved. This is what people will see.';
          return show(f);
        }).catch(function (e) { note.textContent = e.message; });
      };
    }
  })();
  </script>
</body>
</html>
