<!DOCTYPE html>
<html lang="en">
<head>
  <script>if (location.protocol === "http:" && /legacybiblechurch\.com$/.test(location.hostname)) location.replace("https:" + location.href.slice(5));</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunday Rotation · Legacy Bible Church</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    @font-face { font-family: 'Priestacy'; src: url('fonts/Priestacy.woff') format('woff'), url('fonts/Priestacy.otf') format('opentype'); font-display: swap; }
    :root {
      --bg: #0d0d0f; --panel: #141416; --panel-2: #1b1b1e; --line: #2a2a2e; --line-soft: #202024;
      --ink: #ececed; --ink-dim: #9a9a9e; --ink-faint: #62626a; --gold: #c9a84c; --good: #7bb37e; --warn: #d8a657;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; padding: 40px 20px 80px; }
    .wrap { max-width: 560px; margin: 0 auto; }
    .back { display: inline-block; font-size: 13px; color: var(--ink-dim); text-decoration: none; margin-bottom: 18px; }
    .brand { font-family: 'Priestacy', var(--font); font-size: 40px; line-height: 1; }
    .brand-sub { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 22px; }

    /* this Sunday: two names, big */
    .now { margin-top: 26px; border: 1px solid var(--gold); border-radius: 14px; background: var(--panel); padding: 20px 20px 18px; }
    .now .k { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
    .now .d { font-size: 15px; color: var(--ink-dim); margin-top: 2px; }
    .jobs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 16px; }
    .job { background: var(--panel-2); border-radius: 10px; padding: 14px 16px; }
    .job .j { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
    .job .who { font-size: 22px; font-weight: 600; margin-top: 4px; line-height: 1.15; }
    .job .what { font-size: 12.5px; color: var(--ink-dim); margin-top: 6px; }
    .now.off .who { color: var(--ink-faint); }
    .note { margin-top: 12px; font-size: 13.5px; color: var(--warn); }

    .next { margin-top: 10px; padding: 12px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 14px; color: var(--ink-dim); display: flex; gap: 14px; flex-wrap: wrap; }
    .next b { color: var(--ink); font-weight: 600; }

    h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); margin: 34px 0 8px; display: flex; align-items: baseline; gap: 10px; }
    h2 small { font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink-faint); font-size: 11px; margin-left: auto; }
    .box { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }

    /* the two jobs, spelled out */
    .how { padding: 14px 18px; border-bottom: 1px solid var(--line-soft); font-size: 14.5px; }
    .how:last-child { border-bottom: 0; }
    .how b { display: block; font-weight: 600; margin-bottom: 4px; }
    .how > div { margin-top: 6px; }
    a.how.link { display: flex; justify-content: space-between; align-items: center; color: var(--ink); text-decoration: none; font-weight: 500; padding: 13px 18px; }
    a.how.link:hover { background: var(--panel-2); }
    a.how.link .arrow { color: var(--ink-faint); }
    .how ol { margin: 4px 0 0 18px; color: var(--ink-dim); }
    .how li { margin: 3px 0; }
    .how a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    .how a:hover { border-color: var(--ink-dim); }

    /* the weeks ahead */
    .wk { display: grid; grid-template-columns: 62px 1fr 1fr 1fr auto; gap: 10px; align-items: center; padding: 11px 18px; border-bottom: 1px solid var(--line-soft); font-size: 14.5px; }
    .wk:last-child { border-bottom: 0; }
    .wk.is-now { background: var(--panel-2); }
    .wk .dt { color: var(--ink-dim); font-variant-numeric: tabular-nums; }
    .wk.is-now .dt { color: var(--gold); font-weight: 600; }
    .wk .nm { font-weight: 500; }
    .wk .nm small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
    .wk.off .nm { color: var(--ink-faint); text-decoration: line-through; }
    .wk .ch { font-size: 12px; color: var(--ink-faint); background: none; border: 1px solid transparent; font: inherit; padding: 3px 8px; border-radius: 999px; cursor: pointer; }
    .wk:hover .ch { border-color: var(--line); color: var(--ink-dim); }
    .wk .mark { font-size: 11px; color: var(--warn); }

    /* editing one Sunday */
    .edit { padding: 12px 18px 14px; border-bottom: 1px solid var(--line-soft); background: #121214; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .edit label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); display: block; }
    .edit select, .edit input[type=text] { width: 100%; margin-top: 4px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; }
    .edit .full { grid-column: 1 / -1; }
    .edit .off { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-dim); text-transform: none; letter-spacing: 0; font-weight: 500; }
    .edit .btns { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
    .btn { background: rgba(201,168,76,0.09); color: var(--gold); border: 1px solid rgba(201,168,76,0.34); font: inherit; font-weight: 600; font-size: 13.5px; padding: 7px 16px; border-radius: 999px; cursor: pointer; transition: background 160ms ease, border-color 160ms ease; }
    .btn:hover:not(:disabled) { background: rgba(201,168,76,0.17); border-color: rgba(201,168,76,0.7); }
    .btn.quiet { background: none; color: var(--ink-dim); border: 1px solid var(--line); font-weight: 500; }
    .btn.quiet:hover:not(:disabled) { background: none; color: var(--ink); border-color: var(--ink-faint); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .msg { font-size: 12.5px; color: var(--ink-dim); margin-left: auto; }
    .msg.bad { color: var(--warn); }
    .nokey { padding: 12px 18px; font-size: 13px; color: var(--ink-dim); border-bottom: 1px solid var(--line-soft); background: #121214; }
    .nokey a { color: var(--ink); }

    /* a name you can tap: looks like the name, opens the list of people */
    select.pick { -webkit-appearance: none; appearance: none; background: none; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; color: inherit; font: inherit; font-weight: 500; padding: 1px 0 2px; margin: 0; max-width: 100%; cursor: pointer; text-overflow: ellipsis; }
    select.pick:hover, select.pick:focus { border-bottom-color: var(--gold); outline: none; }
    select.pick option { color: #111; }
    .status { font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 11.5px; margin-left: auto; color: var(--ink-faint); transition: opacity 400ms; }
    .status.bad { color: var(--warn); }
    .status.ok { color: var(--good); }
    h2 .link { margin-left: auto; background: none; border: 0; color: var(--ink-dim); font: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: 0; text-transform: none; cursor: pointer; padding: 0; }
    h2 .link:hover { color: var(--ink); }

    /* the people, in order */
    .ppl { padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 8px; }
    .ppl span { font-size: 14px; background: var(--panel-2); border-radius: 999px; padding: 5px 12px 5px 6px; display: inline-flex; align-items: center; gap: 8px; }
    .ppl span i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--gold); width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; }
    .prow { display: flex; align-items: center; gap: 8px; padding: 9px 18px; border-bottom: 1px solid var(--line-soft); font-size: 15px; }
    .prow b { font-weight: 500; flex: 1; }
    .prow i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--gold); width: 22px; }
    .prow button, .padd button { background: none; border: 1px solid var(--line); color: var(--ink-dim); font: inherit; font-size: 13px; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
    .prow button:hover:not(:disabled), .padd button:hover { color: var(--ink); border-color: var(--ink-faint); }
    .prow button:disabled { opacity: 0.3; cursor: default; }
    .padd { display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); }
    .padd input { flex: 1; min-width: 0; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; }
    .padd button { width: auto; padding: 0 14px; }
    .pbtns { display: flex; gap: 8px; align-items: center; padding: 12px 18px; }

    .foot { margin-top: 32px; font-size: 13px; color: var(--ink-faint); }
    .foot a { color: var(--ink-dim); }
    @media (max-width: 480px) {
      body { padding: 24px 14px 64px; } .brand { font-size: 34px; }
      .wk { grid-template-columns: 50px 1fr 1fr 1fr auto; gap: 6px; padding: 11px 12px; font-size: 13px; }
      .wk .ch { padding: 3px 5px; font-size: 11px; }
      .jobs { grid-template-columns: 1fr; gap: 8px; }
      .job { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 11px 14px; }
      .job .j { width: auto; min-width: 54px; white-space: nowrap; } .job .who { font-size: 20px; margin: 0; }
      .edit { grid-template-columns: 1fr; }
    }
  </style>

</head>
<body>
  <div class="wrap">
    <a class="lbc-back" href="worship.html"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>Home</a>
    <div class="brand">Sunday Rotation</div>
    <div class="brand-sub">Legacy Bible Church</div>

    <div class="now" id="now">
      <div class="k">This Sunday</div>
      <div class="d" id="now-date"></div>
      <div class="jobs">
        <div class="job"><div class="j">Guide &amp; Slides</div><div class="who" id="now-slides"></div></div>
        <div class="job"><div class="j">Stream</div><div class="who" id="now-stream"></div></div>
        <div class="job"><div class="j">Table</div><div class="who" id="now-table"></div></div>
      </div>
      <div class="note" id="now-note" hidden></div>
    </div>
    <div class="next" id="next"></div>

    <h2>The jobs</h2>
    <div class="box">
      <a class="how link" href="jobs/slides/"><span>Guide &amp; Slides</span><span class="arrow">&rarr;</span></a>
      <a class="how link" href="jobs/stream/"><span>Stream</span><span class="arrow">&rarr;</span></a>
      <a class="how link" href="jobs/table/"><span>Table</span><span class="arrow">&rarr;</span></a>
    </div>
    <h2>The weeks ahead <span class="status" id="status"></span></h2>
    <div class="box" id="weeks"></div>

    <h2>The order <button type="button" class="link" id="p-edit" hidden>Edit</button></h2>
    <div class="box" id="people"></div>

    <p class="foot" id="foot"></p>
  </div>

  <script src="js/rotation-data.js"></script>
  <script src="js/rotation.js"></script>
  <script>
  (function () {
    'use strict';
    var R = LBCRotation, REPO = 'legacybiblechurch/worship', PATH = 'js/rotation-data.js', TOKEN_KEY = 'lbc-gh-token';
    var qs = new URLSearchParams(location.search);
    var TODAY = qs.get('today') || R.today();          // ?today=2026-12-20 to look at another week
    var WEEKS = 14, editing = null;
    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }

    var editingPeople = null;                              // a working copy of the order while it is being edited
    var sayTimer = null;
    function say(text, kind) { var st = el('status'); clearTimeout(sayTimer); st.className = 'status' + (kind ? ' ' + kind : ''); st.textContent = text || ''; if (kind === 'ok') sayTimer = setTimeout(function () { say(''); }, 2500); }

    function paint() {
      var c = R.cfg(), rows = R.list(TODAY, WEEKS), now = rows[0], nxt = rows[1], can = !!token(), people = c.people || [];
      el('now-date').textContent = R.longLabel(now.date);
      el('now-slides').textContent = now.off ? 'No service' : now.slides;
      el('now-stream').textContent = now.off ? '' : now.stream;
      el('now-table').textContent = now.off ? '' : now.table;
      el('now').className = 'now' + (now.off ? ' off' : '');
      el('now-note').hidden = !now.note; el('now-note').textContent = now.note || '';
      el('next').innerHTML = nxt.off
        ? '<span>Next Sunday, ' + esc(R.label(nxt.date)) + ': <b>no service</b>' + (nxt.note ? ' · ' + esc(nxt.note) : '') + '</span>'
        : '<span>Next Sunday, ' + esc(R.label(nxt.date)) + '</span><span>Guide <b>' + esc(nxt.slides) + '</b></span><span>Stream <b>' + esc(nxt.stream) + '</b></span><span>Table <b>' + esc(nxt.table) + '</b></span>';

      function name(w, job) {
        if (w.off) return '—';
        if (!can) return esc(w[job]);
        var list = people.indexOf(w[job]) < 0 ? people.concat([w[job]]) : people;
        return '<select class="pick" data-date="' + w.date + '" data-job="' + job + '" aria-label="' + job + ' on ' + esc(R.label(w.date)) + '">' +
          list.map(function (p) { return '<option' + (p === w[job] ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select>';
      }
      var html = '';
      rows.forEach(function (w, i) {
        var marks = w.changed ? '<span class="mark">' + (w.off ? 'off' : 'changed') + (w.note ? ' · ' + esc(w.note) : '') + '</span>' : '';
        html += '<div class="wk' + (i === 0 ? ' is-now' : '') + (w.off ? ' off' : '') + '" data-date="' + w.date + '">' +
          '<span class="dt">' + esc(R.label(w.date)) + '</span>' +
          '<span class="nm"><small>Guide</small>' + name(w, 'slides') + '</span>' +
          '<span class="nm"><small>Stream</small>' + name(w, 'stream') + '</span>' +
          '<span class="nm"><small>Table</small>' + name(w, 'table') + '</span>' +
          '<span>' + marks + (can ? ' <button type="button" class="ch" data-date="' + w.date + '">More</button>' : '') + '</span></div>';
        if (editing === w.date) html += editor(w);
      });
      el('weeks').innerHTML = html;

      el('p-edit').hidden = !can || !!editingPeople;
      if (editingPeople) {
        el('people').innerHTML = editingPeople.map(function (p, i) {
          return '<div class="prow"><i>' + (i + 1) + '</i><b>' + esc(p) + '</b>' +
            '<button type="button" data-p="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Move ' + esc(p) + ' up">&uarr;</button>' +
            '<button type="button" data-p="down" data-i="' + i + '"' + (i === editingPeople.length - 1 ? ' disabled' : '') + ' aria-label="Move ' + esc(p) + ' down">&darr;</button>' +
            '<button type="button" data-p="drop" data-i="' + i + '" aria-label="Remove ' + esc(p) + '">&times;</button></div>';
        }).join('') +
          '<div class="padd"><input type="text" id="p-name" placeholder="Add a name" autocomplete="off"><button type="button" id="p-add">Add</button></div>' +
          '<div class="pbtns"><button type="button" class="btn" id="p-save">Save</button><button type="button" class="btn quiet" id="p-cancel">Cancel</button><span class="msg" id="p-msg">Saving reshuffles every Sunday ahead.</span></div>';
      } else {
        el('people').innerHTML = '<div class="ppl">' + people.map(function (p, i) { return '<span><i>' + (i + 1) + '</i>' + esc(p) + '</span>'; }).join('') + '</div>';
      }
      el('foot').innerHTML = can ? 'Tap a name to change it. Pick someone already on that Sunday and the two trade places.' : 'To make changes connect this computer in the <a href="worship-studio.html">Studio</a>.';
    }
    function editor(w) {
      return '<div class="edit" id="edit">' +
        '<div class="full"><label>Note (optional)<input type="text" id="e-note" placeholder="Marco away" value="' + esc(w.note || '') + '"></label></div>' +
        '<div class="full"><label class="off"><input type="checkbox" id="e-off"' + (w.off ? ' checked' : '') + '> No service this Sunday</label></div>' +
        '<div class="btns"><button type="button" class="btn" id="e-save">Save</button>' +
        '<button type="button" class="btn quiet" id="e-reset" title="Back to the normal rotation for this Sunday">Back to normal</button>' +
        '<button type="button" class="btn quiet" id="e-cancel">Cancel</button></div></div>';
    }

    // ── saving: rewrite js/rotation-data.js on GitHub, same connection the Studio uses
    function gh(path, opts) {
      opts = opts || {};
      return fetch('https://api.github.com' + path, { method: opts.method || 'GET', body: opts.body,
        headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token(), 'X-GitHub-Api-Version': '2022-11-28' } })
        .then(function (r) { return r.text().then(function (t) { var j = null; try { j = JSON.parse(t); } catch (e) {}
          if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'This computer is not allowed to save. Connect it in the Studio.' : r.status === 409 ? 'Someone else just saved. Reload and try again.' : (j && j.message) || ('HTTP ' + r.status));
          return j; }); });
    }
    function b64e(str) { var b = new TextEncoder().encode(str), s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
    function b64d(b64) { var bin = atob(String(b64).replace(/\s/g, '')), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }
    function serialize(cfg) {
      var head = '// Legacy Bible Church · the Sunday rotation\n' +
        '// Strict JSON between the braces: rotation.html edits it, scripts/rotation_now.py reads it.\n' +
        '//   people   the order. Each job walks down the list one Sunday at a time.\n' +
        '//   jobs     each job\'s offset into the list. Different offsets mean nobody has\n' +
        '//            two jobs the same Sunday. With five people and 0, 1, 3 a person has\n' +
        '//            Slides, two weeks later Table, two weeks later Stream, then round again.\n' +
        '//   start    the Sunday people[0] has Slides.\n' +
        '//   changes  one Sunday done differently: {"slides": "Cole"}, {"stream": "Joel"},\n' +
        '//            {"off": true, "note": "No service"}. Set from the page.\n';
      return head + 'window.LBC_ROTATION = ' + JSON.stringify(cfg, null, 2) + ';\n';
    }
    function copy(o) { return JSON.parse(JSON.stringify(o)); }
    // the plain rotation for a Sunday, as if nothing had been changed by hand
    function baseAt(cfg, date) {
      var keep = window.LBC_ROTATION; window.LBC_ROTATION = Object.assign({}, cfg, { changes: {} });
      var b = R.at(date); window.LBC_ROTATION = keep; return b;
    }
    // write one Sunday into a config: only what differs from the plain rotation is kept
    function setDay(cfg, date, want) {
      var base = baseAt(cfg, date), ch = {};
      cfg.changes = cfg.changes || {};
      if (want.off) ch.off = true;
      else R.JOBS.forEach(function (j) { if (want[j] && want[j] !== base[j]) ch[j] = want[j]; });
      if (want.note) ch.note = want.note;
      if (Object.keys(ch).length) cfg.changes[date] = ch; else delete cfg.changes[date];
    }
    // every save goes through here, one at a time. The page changes at once and goes back if the save fails.
    var line = Promise.resolve();
    function commit(change, message) {
      var before = copy(R.cfg()), shown = copy(before);
      change(shown); window.LBC_ROTATION = shown; paint(); say('Saving…');
      line = line.then(function () {
        return gh('/repos/' + REPO + '/contents/' + PATH + '?ref=main&cb=' + Date.now()).then(function (j) {
          var text = b64d(j.content), m = text.match(/window\.LBC_ROTATION\s*=\s*(\{[\s\S]*\});?\s*$/);
          if (!m) throw new Error('The rotation file looks damaged. Nothing was changed.');
          var cfg = JSON.parse(m[1]); change(cfg);
          return gh('/repos/' + REPO + '/contents/' + PATH, { method: 'PUT', body: JSON.stringify({ message: message, content: b64e(serialize(cfg)), sha: j.sha, branch: 'main' }) })
            .then(function () { window.LBC_ROTATION = cfg; paint(); say('Saved', 'ok'); });
        }).catch(function (e) { window.LBC_ROTATION = before; paint(); say(e.message, 'bad'); });
      });
    }

    // tap a name, pick someone. If that person already has a job that Sunday the two trade places.
    document.addEventListener('change', function (e) {
      var t = e.target; if (!t.classList || !t.classList.contains('pick')) return;
      var date = t.dataset.date, job = t.dataset.job, who = t.value, w = R.at(date);
      if (w[job] === who) return;
      var was = w[job];
      commit(function (cfg) {
        var keep = window.LBC_ROTATION; window.LBC_ROTATION = cfg; var cur = R.at(date); window.LBC_ROTATION = keep;
        var want = { slides: cur.slides, stream: cur.stream, table: cur.table, note: cur.note, off: cur.off };
        R.JOBS.forEach(function (j) { if (j !== job && want[j] === who) want[j] = was; });
        want[job] = who;
        setDay(cfg, date, want);
      }, 'rotation: ' + date + ' ' + job + ' ' + who);
    });

    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t.classList.contains('ch')) { editing = editing === t.dataset.date ? null : t.dataset.date; paint(); return; }
      if (t.id === 'e-cancel') { editing = null; paint(); return; }
      if (t.id === 'e-reset') { var d0 = editing; editing = null; commit(function (cfg) { if (cfg.changes) delete cfg.changes[d0]; }, 'rotation: ' + d0 + ' back to normal'); return; }
      if (t.id === 'e-save') {
        var d = editing, off = el('e-off').checked, note = el('e-note').value.trim(); editing = null;
        commit(function (cfg) {
          var keep = window.LBC_ROTATION; window.LBC_ROTATION = cfg; var cur = R.at(d); window.LBC_ROTATION = keep;
          setDay(cfg, d, { slides: cur.slides, stream: cur.stream, table: cur.table, note: note, off: off });
        }, 'rotation: ' + d + (off ? ' no service' : ' note'));
        return;
      }
      // the order
      if (t.id === 'p-edit') { editingPeople = (R.cfg().people || []).slice(); paint(); return; }
      if (t.id === 'p-cancel') { editingPeople = null; paint(); return; }
      if (t.dataset && t.dataset.p && editingPeople) {
        var i = +t.dataset.i, L = editingPeople;
        if (t.dataset.p === 'up' && i > 0) L.splice(i - 1, 0, L.splice(i, 1)[0]);
        if (t.dataset.p === 'down' && i < L.length - 1) L.splice(i + 1, 0, L.splice(i, 1)[0]);
        if (t.dataset.p === 'drop') L.splice(i, 1);
        paint(); return;
      }
      if (t.id === 'p-add') { addPerson(); return; }
      if (t.id === 'p-save') {
        var list = editingPeople.slice();
        if (list.length < 3) { el('p-msg').className = 'msg bad'; el('p-msg').textContent = 'Three jobs need at least three people.'; return; }
        editingPeople = null;
        commit(function (cfg) {
          cfg.people = list;
          cfg.jobs = list.length >= 4 ? { slides: 0, stream: 1, table: 3 } : { slides: 0, stream: 1, table: 2 };   // offsets that never give one person two jobs
          Object.keys(cfg.changes || {}).forEach(function (d) {            // a hand-made change that names someone who left is dropped
            R.JOBS.forEach(function (j) { if (cfg.changes[d][j] && list.indexOf(cfg.changes[d][j]) < 0) delete cfg.changes[d][j]; });
            if (!Object.keys(cfg.changes[d]).length) delete cfg.changes[d];
          });
        }, 'rotation: the order is ' + list.join(', '));
      }
    });
    function addPerson() {
      var inp = el('p-name'), v = (inp.value || '').trim().replace(/\s+/g, ' ');
      if (!v) { inp.focus(); return; }
      if (editingPeople.some(function (p) { return p.toLowerCase() === v.toLowerCase(); })) { el('p-msg').className = 'msg bad'; el('p-msg').textContent = v + ' is already on the list.'; return; }
      editingPeople.push(v); paint(); el('p-name').focus();
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'p-name') { e.preventDefault(); addPerson(); } });
    paint();
  })();
  </script>
</body>
