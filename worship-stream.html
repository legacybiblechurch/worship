<!DOCTYPE html>
<html lang="en">
<head>
  <script>if (location.protocol === "http:" && /legacybiblechurch\.com$/.test(location.hostname)) location.replace("https:" + location.href.slice(5));</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream lyrics — Legacy Bible Church</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* The livestream overlay. Load this one page as a web widget in PRISM,
       stretched over the whole picture, and leave it. It needs no settings:
         - before the service on Sunday it shows "Service begins shortly" with a
           countdown, and fades away by itself at the service time
         - whenever Worship Control has a slide up it shows the words, full
           screen on black (the pulpit is empty while we sing)
         - the rest of the time it draws nothing and the camera shows through
       It follows Control through the church's room code (js/sheet.js), the
       same relay the phone remote uses. STREAM.md lists the optional settings. */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      cursor: none;
      user-select: none; -webkit-user-select: none;
    }
    body.bg-green { background: #00ff00; }   /* ?bg=green  for a chroma-key filter */
    body.bg-solid { background: #000; }      /* ?bg=solid  when transparency is not available */

    /* ── the words ── */
    #plate {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1;
      padding: 0.55em 1.2em 0.7em;
      text-align: center;
      line-height: 1.28;
      opacity: 0;
      transition: opacity 0.28s ease;
      background: linear-gradient(to top, rgba(0,0,0,0.80) 0%, rgba(0,0,0,0.66) 70%, rgba(0,0,0,0) 100%);
    }
    #plate.on { opacity: 1; }
    body.bg-green #plate { background: none; }
    body.bg-solid #plate { background: #000; }
    .line {
      font-weight: 500;
      color: #fff;
      text-shadow: 0 0.06em 0.22em rgba(0,0,0,0.9), 0 0 0.05em rgba(0,0,0,0.9);
    }
    /* a reading's reference or the sermon title: small, gold, above the words */
    .kicker {
      font-size: 0.42em; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
      color: #C9A84C; margin-bottom: 0.6em;
    }
    /* only the text fades between slides; the panel behind it stays put, so the
       camera never flashes through mid-song */
    #lines { transition: opacity 0.18s ease; }
    #lines.prose { text-align: left; width: min(92%, 34ch); margin: 0 auto; }
    #lines.prose .kicker { text-align: center; }
    #lines.prose .line { text-wrap: pretty; line-height: 1.32; margin-bottom: 0.45em; font-size: 0.9em; }
    #lines.prose .vn { font-size: 0.5em; font-weight: 700; color: #C9A84C; vertical-align: 0.55em; margin-right: 0.4em; }
    #lines.swap { opacity: 0; }

    /* ?mode=panel  big words on a dark panel in the middle of the picture, the
       rest transparent, so the widget can be any size and a gap left for
       PRISM's own buttons never shows on the stream. */
    body.panel #plate, body.black #plate {
      top: 0;
      padding: 4vh 4vw;
      display: flex; align-items: center; justify-content: center;
      background: none;
    }
    body.panel #lines {
      background: rgba(0, 0, 0, 0.74);
      border-radius: 0.5em;
      padding: 0.7em 1.1em 0.8em;
      max-width: 92%;
    }
    body.panel .line, body.black .line { font-weight: 400; text-shadow: none; }

    /* black (default): the whole widget black with the words centred, like the
       TV. Stretch the widget as close to the full picture as PRISM allows. */
    body.black #plate { background: #000; }

    /* a sermon slide: the preacher stays in the picture and the title or the
       point sits in a bar at the bottom left, like a broadcast caption.
       (?third=sermon,scripture puts readings there too; ?third=none turns it off) */
    body.third #plate {
      top: auto; bottom: 0; left: 0; right: 0;
      display: block; padding: 0 5vw 6vh 5vw;
      text-align: left; background: none;
    }
    body.third #lines {
      display: inline-block; max-width: 64vw;
      background: #0e0e0d;                       /* solid on purpose: anything translucent gets eaten by the key */
      border-radius: 0.32em;
      padding: 0.62em 1.25em 0.7em 1.25em;
    }
    /* the gold sliver that traces the card's edge, the same one as the website's cards.
       It rides inside the card's own edge, over the dark, so the key never eats it */
    @property --trace-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    body.third #lines { position: relative; }
    body.third #lines::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 0.16em; pointer-events: none;
      background: conic-gradient(from var(--trace-angle), transparent 0deg, transparent 290deg, rgba(201,168,76,0.3) 300deg, #C9A84C 335deg, #f6e3a1 350deg, transparent 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      animation: trace-spin 6s linear infinite;
    }
    @keyframes trace-spin { to { --trace-angle: 360deg; } }
    body.third .kicker { font-size: 0.4em; letter-spacing: 0.22em; margin-bottom: 0.42em; opacity: 0.95; }
    body.third .line { font-weight: 500; text-shadow: none; line-height: 1.24; text-wrap: balance; }
    body.third .line + .line { margin-top: 0.28em; }
    .nb { white-space: nowrap; }
    .cite { display: block; font-size: 0.5em; font-weight: 600; letter-spacing: 0.08em; color: #C9A84C; margin-top: 0.45em; }
    .line, .slide-line { text-wrap: balance; }

    /* ── the starting-soon card, above the words: the "Hairline" design ──
       A 1280×720 board, scaled to whatever the window is. Logo top left,
       Sunday · 10:30 AM top right, "Worship begins in" and the big thin time,
       and a 2px gold hairline that drains toward the start. */
    #card {
      position: fixed; inset: 0; z-index: 2;
      background: #0B0B0A; color: #F5F3EE;
      font-family: 'Inter', system-ui, sans-serif;
      opacity: 0; pointer-events: none;
      transition: opacity 1.6s ease;
    }
    #card.on { opacity: 1; }
    #board {
      position: absolute; left: 50%; top: 50%;
      width: 1280px; height: 720px; box-sizing: border-box;
      transform: translate(-50%, -50%) scale(var(--k, 1));
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 72px 96px;
    }
    #board .top { display: flex; justify-content: space-between; align-items: flex-start; }
    #logo { width: 170px; height: auto; display: block; }
    #l2 { font-size: 13px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #8A8780; padding-top: 18px; }
    #board .bottom { display: flex; flex-direction: column; gap: 28px; }
    #board .row { display: flex; justify-content: space-between; align-items: flex-end; }
    #l1 { font-size: 30px; font-weight: 300; letter-spacing: -0.01em; color: #CFCBC2; padding-bottom: 18px; }
    #count { font-size: 168px; font-weight: 200; letter-spacing: -0.04em; line-height: 0.82; font-variant-numeric: tabular-nums; min-height: 0.82em; }
    #track { height: 2px; width: 100%; background: #1E1D1A; border-radius: 2px; position: relative; }
    #fillbar {
      position: absolute; left: 0; top: 0; height: 2px; width: 100%; border-radius: 2px;
      background: linear-gradient(90deg, rgba(201,168,76,0.08) 0%, rgba(201,168,76,0.55) 55%, #F0D585 100%);
      box-shadow: 0 0 18px rgba(201,168,76,0.28);
      transition: width 1s linear;
    }
    #fillbar .clip { position: absolute; inset: 0; overflow: hidden; border-radius: 2px; }
    #fillbar .flow { position: absolute; top: 0; bottom: 0; left: 0; width: 240px; background: linear-gradient(90deg, transparent, rgba(255,240,190,0.9) 55%, transparent); animation: flow 3.2s cubic-bezier(.45,0,.25,1) infinite; }
    @keyframes flow { 0% { transform: translateX(-240px); } 100% { transform: translateX(1100px); } }
    #fillbar .head { position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #F0D585; box-shadow: 0 0 10px 2px rgba(240,213,133,0.75), 0 0 28px 8px rgba(201,168,76,0.3); animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    @media (prefers-reduced-motion: reduce) { #fillbar .flow, #fillbar .head { animation: none; } }

    /* ?debug=1  small status box for a dry run */
    #hud {
      position: fixed; top: 8px; left: 8px; z-index: 9;
      font: 12px/1.5 ui-monospace, Menlo, monospace;
      background: rgba(0,0,0,0.78); color: #9fe39f;
      padding: 6px 10px; border-radius: 6px; display: none; white-space: pre;
    }
    #hud.bad { color: #ffb3a8; }
    /* the OBS window before it is full screen */
    #fill { display: none; position: fixed; top: 4vh; left: 50%; transform: translateX(-50%); z-index: 9; font-size: clamp(13px, 1.6vw, 20px); font-weight: 500; color: #111; background: rgba(255,255,255,0.85); border-radius: 999px; padding: 0.55em 1.3em; white-space: nowrap; }
  </style>
</head>
<body>

  <div id="plate"><div id="lines"></div></div>

  <div id="card">
    <div id="board">
      <div class="top">
        <img id="logo" src="images/logo-dark.png" alt="Legacy Bible Church">
        <div id="l2">Sunday · 10:30 AM</div>
      </div>
      <div class="bottom">
        <div class="row">
          <div id="l1">Worship begins in</div>
          <div id="count"></div>
        </div>
        <div id="track"><div id="fillbar"><div class="clip"><div class="flow"></div></div><div class="head"></div></div></div>
      </div>
    </div>
  </div>

  <div id="hud"></div>
  <div id="fill">Click once to fill the screen, then leave this window alone</div>

  <script>
  (function () {
    var qs    = new URLSearchParams(location.search);
    var TEST  = qs.has('test');                                   // always show a sample slide, ignore Control
    var DEBUG = qs.has('debug');                                  // status box
    var bg    = (qs.get('bg') || '').toLowerCase();
    if (bg === 'green' || bg === 'solid') document.body.classList.add('bg-' + bg);
    var MODE  = (qs.get('mode') || 'black').toLowerCase();              // black (default) | panel | lower
    if (MODE === 'full') MODE = 'black';                                  // the old name for black
    if (MODE !== 'black' && MODE !== 'lower') MODE = 'panel';
    document.body.classList.add(MODE);
    // which items show as a bottom-left bar with the camera still up: the sermon, by default
    var THIRD = (qs.get('third') === null ? 'sermon' : qs.get('third')).toLowerCase().split(',').filter(Boolean);
    function isFull() { return MODE !== 'lower' && !document.body.classList.contains('third'); }

    // the starting-soon card
    var CARD  = qs.get('card') !== '0';                           // ?card=0 turns it off
    var TZ    = qs.get('tz') || 'America/Los_Angeles';
    var parts = (qs.get('at') || '10:30').split(':');
    var AT    = (+parts[0] || 0) * 3600 + (+parts[1] || 0) * 60;  // service start, seconds into the day
    var IN    = qs.has('in') ? parseFloat(qs.get('in')) : null;   // rehearsal: pretend it starts in N minutes
    var HOLD  = qs.has('hold') ? parseFloat(qs.get('hold')) : 0.25;  // minutes to stay up after the start time (15 s: clocks differ a little)
    var INTRO = qs.has('intro') ? parseFloat(qs.get('intro')) : 20; // seconds the card shows on a day with no service
    var PIN   = qs.has('pin');                                    // never fade
    var MUSIC = qs.get('music') || '';                            // optional audio file while the card is up
    var VOL   = qs.has('vol') ? parseFloat(qs.get('vol')) : 0.5;

    var SAMPLE = ['Amazing grace, how sweet the sound', 'That saved a wretch like me', 'I once was lost, but now am found', 'Was blind, but now I see'];

    var plate = document.getElementById('plate'), lines = document.getElementById('lines');
    var card = document.getElementById('card'), l1 = document.getElementById('l1'), l2 = document.getElementById('l2'), count = document.getElementById('count');
    var board = document.getElementById('board'), fillbar = document.getElementById('fillbar');
    function fitBoard() { board.style.setProperty('--k', Math.min(window.innerWidth / 1280, window.innerHeight / 720)); }
    fitBoard(); window.addEventListener('resize', fitBoard);
    var WINDOW = 30 * 60;   // the hairline is full half an hour out and empty at the start
    var SONGS = [], ready = false, pending = null;
    var last = null, lastAt = 0, lastFrom = '-', lastRelayT = 0, relay = 'off';
    var code = '', topic = '';
    var tok = 0, cur = '';
    var hudNote = '';

    function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // ── the words ──────────────────────────────────────────────────────────
    // largest size that fits, so the widget can be any size
    function fit() {
      var vw = window.innerWidth, vh = window.innerHeight, n = 0, FULL = isFull(), THIRD_ON = document.body.classList.contains('third');
      var size = FULL ? Math.min(vw * 0.052, vh * 0.092) : Math.min(vw * 0.030, vh * 0.052);
      var limit = FULL ? vh * 0.84 : THIRD_ON ? vh * 0.36 : vh * 0.97;
      function h() { return FULL || THIRD_ON ? lines.offsetHeight : plate.offsetHeight; }
      plate.style.fontSize = size + 'px';
      while (h() > limit && size > 10 && n++ < 60) { size *= 0.94; plate.style.fontSize = size + 'px'; }
    }
    function hide() { tok++; cur = ''; plate.classList.remove('on'); lines.classList.remove('swap'); }
    function show(arr, firstIsKicker, rich, prose) {
      var key = arr.join('\n');
      if (key === cur && plate.classList.contains('on')) return;
      var my = ++tok;
      function swap() {
        if (my !== tok) return;
        lines.classList.toggle('prose', !!prose);
        lines.innerHTML = arr.map(function (l, i) { var k = firstIsKicker && i === 0; return '<div class="' + (k ? 'kicker' : 'line') + '">' + (k ? esc(l) : prose ? LBCSheet.proseLine(l) : rich ? LBCSheet.markup(l) : esc(l)) + '</div>'; }).join('');
        fit(); cur = key; plate.classList.add('on'); lines.classList.remove('swap');
      }
      // slide to slide: fade only the text, the panel stays. Hidden to showing: fade the whole plate in.
      if (plate.classList.contains('on')) { lines.classList.add('swap'); setTimeout(swap, 190); } else swap();
    }
    // full black for a song, a bar for the sermon: when the layout changes the
    // whole plate fades out and back in, never a jump between the two
    function layout(third) {
      var was = document.body.classList.contains('third');
      if (was === third) return 0;
      var on = plate.classList.contains('on');
      // nothing showing: switch at once, so the words that follow are measured for the right layout
      // (switching a beat later sized the first sermon card for the full screen, hence the giant title card)
      if (!on) { document.body.classList.toggle('third', third); return 0; }
      hide();
      setTimeout(function () { document.body.classList.toggle('third', third); if (plate.classList.contains('on')) fit(); }, 290);
      return 300;
    }
    function apply(st) {
      if (!st || st.blank || st.songIndex == null) return hide();
      var song = SONGS[st.songIndex], slide = song && song.slides[st.slideIndex];
      if (!slide || slide.logo || !slide.lines || !slide.lines.length) return hide();   // a video cue or logo slot: camera
      var wait = layout(THIRD.indexOf(song.type) >= 0);
      var arr = slide.kicker ? [slide.kicker].concat(slide.lines) : slide.lines, my = ++tok;
      if (wait) setTimeout(function () { if (my === tok) show(arr, !!slide.kicker, !!slide.rich, !!slide.prose); }, wait);
      else show(arr, !!slide.kicker, !!slide.rich, !!slide.prose);
    }
    function handle(d, from, t) {
      if (t) { if (t < lastRelayT) return; lastRelayT = t; }   // never let an older relay message win
      last = { songIndex: d.songIndex, slideIndex: d.slideIndex, blank: !!d.blank };
      lastAt = Date.now(); lastFrom = from;
      if (TEST) return;
      if (!ready) { pending = last; return; }
      apply(last);
    }

    // Control in this browser (same machine)
    try {
      var ch = new BroadcastChannel('lbc-worship');
      ch.onmessage = function (e) {
        var d = e.data;
        if (d && d.type === 'who') { if (bg) ch.postMessage({ type: 'ping', from: 'stream' }); return; }
        if (!d || d.type === 'ping' || d.type === 'cmd' || d.songIndex === undefined) return;
        handle(d, 'local');
      };
      // tell Control this window is open (its start strip ticks "stream window")
      if (bg) { ch.postMessage({ type: 'ping', from: 'stream' }); setInterval(function () { ch.postMessage({ type: 'ping', from: 'stream' }); }, 1500); }
    } catch (e) {}

    // the OBS window. On a Mac one click fills a screen and the window gets its own
    // desktop. On Windows a full-screen window would cover Control, so there the
    // window simply stays open (Chrome runs with the flag that keeps a covered
    // window drawing; OBS-SETUP.md) and the hint says so, then goes away.
    if (bg) {
      var fillHint = document.getElementById('fill'), WIN = /Win/.test(navigator.platform);
      if (WIN) {
        fillHint.textContent = 'Leave this window open. Behind the others is fine. Never minimize it.';
        fillHint.style.display = 'block';
        setTimeout(function () { fillHint.style.display = 'none'; }, 12000);
        document.addEventListener('click', function () { fillHint.style.display = 'none'; });
      } else {
        var fill = function () { var el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {}); };
        var paintFill = function () { fillHint.style.display = document.fullscreenElement ? 'none' : 'block'; };
        document.addEventListener('click', fill);
        document.addEventListener('fullscreenchange', paintFill);
        paintFill();
      }
    }

    // Control anywhere (the iPad, another browser): the relay the phone remote uses
    function listen() {
      if (!topic) return;
      var syncLast = function () {   // the slide Control is on now, if recent; covers a page opened mid-service
        fetch('https://ntfy.sh/' + topic + '/json?poll=1&since=2h').then(function (r) { return r.text(); }).then(function (t) {
          var rows = t.trim().split('\n').filter(Boolean);
          for (var i = rows.length - 1; i >= 0; i--) {
            try {
              var m = JSON.parse(rows[i]), d = JSON.parse(m.message);
              if (d.type === 'state') { if (m.time > lastRelayT) handle(d, 'relay (resumed)', m.time); return; }
            } catch (x) {}
          }
        }).catch(function () {});
      };
      (function connect() {
        var es = new EventSource('https://ntfy.sh/' + topic + '/sse');
        es.onopen = function () { relay = 'on'; syncLast(); };
        es.onmessage = function (ev) {
          try { var m = JSON.parse(ev.data), d = JSON.parse(m.message); if (d.type === 'state') handle(d, 'relay', m.time); } catch (x) {}
        };
        es.onerror = function () { relay = 'off'; es.close(); setTimeout(connect, 3000); };
      })();
    }

    // ── the starting-soon card ─────────────────────────────────────────────
    var t0 = Date.now(), cardDone = false, cardState = 'off', rem = null, musicState = MUSIC ? 'waiting' : 'none', audio = null;
    function ptNow() {
      var o = {};
      new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour12: false, weekday: 'short', hour: 'numeric', minute: 'numeric', second: 'numeric' })
        .formatToParts(new Date()).forEach(function (x) { o[x.type] = x.value; });
      return { dow: o.weekday, secs: (+o.hour % 24) * 3600 + (+o.minute) * 60 + (+o.second) };
    }
    function remaining() {   // seconds until the service (negative once it has started), or null on a day with none
      if (IN !== null) return IN * 60 - (Date.now() - t0) / 1000;
      var p = ptNow();
      return p.dow === 'Sun' ? AT - p.secs : null;
    }
    function clock() {
      var h = Math.floor(AT / 3600), m = Math.floor((AT % 3600) / 60), ap = h >= 12 ? 'PM' : 'AM';
      return (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
    }
    function mmss(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
    function startMusic() {
      if (!MUSIC || audio) return;
      audio = new Audio(MUSIC); audio.loop = true; audio.volume = Math.max(0, Math.min(1, VOL));
      audio.play().then(function () { musicState = 'playing'; }).catch(function () {
        musicState = 'blocked (needs a tap)';
        var retry = function () { audio.play().then(function () { musicState = 'playing'; }).catch(function () {}); };
        ['click', 'touchstart', 'keydown'].forEach(function (ev) { document.addEventListener(ev, retry, { once: true }); });
      });
    }
    function stopMusic() {
      if (!audio) return;
      var a = audio, v = a.volume, step = v / 30;
      var iv = setInterval(function () { v -= step; if (v <= 0.01) { clearInterval(iv); a.pause(); musicState = 'stopped'; } else a.volume = v; }, 100);
    }
    function cardOn() { if (!card.classList.contains('on')) { card.classList.add('on'); startMusic(); } }
    function cardOff() { cardDone = true; card.classList.remove('on'); stopMusic(); }
    function tick() {
      if (cardDone) return;
      rem = remaining();
      if (rem === null) {
        // no service today: a short welcome so whoever is setting the widget up sees it loaded
        if ((Date.now() - t0) / 1000 < INTRO || PIN) { cardState = 'intro'; l2.textContent = 'Sundays · ' + clock(); l1.textContent = 'Worship begins at'; count.textContent = clock().replace(/ [AP]M$/, ''); fillbar.style.width = '100%'; cardOn(); }
        else { cardState = 'off'; cardOff(); }
      } else if (rem > 0 || PIN) {
        cardState = 'before'; l2.textContent = 'Sunday · ' + clock();
        if (rem > 99 * 60) { l1.textContent = 'Worship begins at'; count.textContent = clock().replace(/ [AP]M$/, ''); }
        else { l1.textContent = 'Worship begins in'; count.textContent = mmss(rem); }
        fillbar.style.width = (Math.min(1, Math.max(0, rem / WINDOW)) * 100).toFixed(2) + '%';
        cardOn();
      } else if (rem > -HOLD * 60) {
        cardState = 'starting'; l1.textContent = 'Worship is beginning'; count.textContent = '0:00'; fillbar.style.width = '0%'; cardOn();
      } else { cardState = 'finished'; cardOff(); }
    }
    if (CARD && !(TEST && IN === null)) { tick(); setInterval(tick, 500); } else { cardState = 'off'; }

    // ── load: the shared module first (it holds the room code), then this Sunday's songs ──
    function load(src, cb) {
      var s = document.createElement('script');
      s.src = src + (src.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();   // fresh copy every load, never a cached one
      s.onload = cb; s.onerror = cb;
      document.head.appendChild(s);
    }
    // this page checks itself too, so a change to it reaches a widget that is already open
    var SIGS = ['js/songs-data.js', 'js/worship-songs.js', 'js/worship-service.js', 'worship-stream.html'], base = {};
    function fresh() {   // reload with a new cache-buster, keeping every other setting
      var p = new URLSearchParams(location.search); p.set('t', Date.now());
      location.replace(location.pathname + '?' + p.toString());
    }
    function sig(u) {
      return fetch(u, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        return r.headers.get('etag') || r.headers.get('last-modified') || r.headers.get('content-length') || '';
      }).catch(function () { return ''; });
    }
    function start() {
      if (!window.LBCSheet) { hudNote = 'sheet.js failed to load'; return; }
      LBCSheet.loadService(function (items) {
        SONGS = items;   // every item of the service, slides already built
        ready = true;
        if (TEST && qs.get('test') === 'sermon') { layout(true); show(['The King of Glory', 'Clean hands and a pure heart'], true); }   // ?test=sermon: the bar
        else if (TEST) show(SAMPLE);
        else if (pending) { apply(pending); pending = null; }
      });
      // the set or the words republished while this is open? reload so they match
      Promise.all(SIGS.map(sig)).then(function (s) { SIGS.forEach(function (u, i) { base[u] = s[i]; }); });
      setInterval(function () {
        SIGS.forEach(function (u) { sig(u).then(function (v) { if (v && base[u] && v !== base[u]) fresh(); }); });
      }, 90000);
    }
    load('js/sheet.js?v=29', function () {
      code = (qs.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!code && window.LBCSheet) code = LBCSheet.ROOM;
      topic = code ? 'lbc-worship-' + code.toLowerCase() + '-7f3a' : '';
      listen();
      load('js/songs-data.js', function () { load('js/worship-songs.js', function () { load('js/worship-service.js', start); }); });
    });

    window.addEventListener('resize', function () { if (plate.classList.contains('on')) fit(); });

    // ── status box ─────────────────────────────────────────────────────────
    if (DEBUG) {
      var hud = document.getElementById('hud');
      hud.style.display = 'block';
      setInterval(function () {
        var age = lastAt ? Math.round((Date.now() - lastAt) / 1000) + 's ago' : 'nothing heard yet';
        var s = last ? ('song ' + (last.songIndex == null ? '-' : last.songIndex + 1) + ' slide ' + ((last.slideIndex || 0) + 1) + (last.blank ? ' (blank)' : '')) : '-';
        hud.className = (!code && !TEST) ? 'bad' : '';
        hud.textContent =
          'room   ' + (code || 'none') + '\n' +
          'relay  ' + (topic ? relay : 'no room') + '\n' +
          'songs  ' + (ready ? SONGS.length + ' loaded' : 'loading') + '\n' +
          'last   ' + s + '  (' + lastFrom + ', ' + age + ')\n' +
          'words  ' + (plate.classList.contains('on') ? 'showing' : 'hidden') + ' · ' + (document.body.classList.contains('third') ? 'bar' : MODE === 'lower' ? 'lower third' : MODE) + '\n' +
          'card   ' + cardState + (rem !== null && cardState !== 'off' ? ' · ' + Math.round(rem) + ' s' : '') + (IN !== null ? ' · rehearsal' : '') + (CARD ? '' : ' (off)') + '\n' +
          'music  ' + musicState +
          (TEST ? '\nmode   test (sample slide)' : '') + (bg ? '\nbg     ' + bg : '') + (hudNote ? '\n' + hudNote : '');
      }, 500);
    }
  })();
  </script>
